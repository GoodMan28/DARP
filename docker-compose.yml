services:
  db:
    image: postgres:16-alpine
    container_name: darp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: darp
      POSTGRES_USER: darp_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - '5432:5432' # in production bind to 127.0.0.1:5432 only
    volumes:
      - darp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darp_owner -d darp']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  darp_pgdata:
