services:
  db:
    image: postgres:16-alpine
    container_name: darp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: darp
      POSTGRES_USER: darp_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      # Loopback-only: only this machine's own processes can reach it. Needed even for local
      # dev now that the app itself has been exposed to the LAN for testing (firewall rule
      # "DARP dev (3000)") — without this, the database's default devpassword would be
      # reachable from any other device on the same network.
      - '127.0.0.1:5432:5432'
    volumes:
      - darp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darp_owner -d darp']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  darp_pgdata:
